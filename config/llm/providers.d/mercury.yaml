# Inception Mercury 3（OpenAI 兼容）
# https://docs.inceptionlabs.ai/get-started/models
# reasoning_effort 经 vendor_params 作为请求体顶层字段下发（instant|low|medium|high）。
# 温度合法区间 0.5–1.0，模型默认 1。
mercury_3:
  label: "Mercury 3"
  base_url: "https://api.inceptionlabs.ai/v1"
  api_key: "${MERCURY_API_KEY}"
  model: "mercury-3"
  temperature: 1.0
  pricing:
    # 上线 5 折：$0.10 / $0.01 / $0.35。恢复原价后改为 0.20 / 0.02 / 0.70。
    currency: "USD"
    cny_per_currency_unit: 7.25
    input_cache_hit_per_million: 0.01
    input_cache_miss_per_million: 0.10
    output_per_million: 0.35
  vendor_params:
    reasoning_effort: low
  capabilities:
    vision: false
    function_calling: true
    parallel_tool_calls: true
    reasoning_content: false
    thinking_tag_inline: false
    context_window: 1000000
