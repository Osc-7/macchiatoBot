# 阿里云百炼 DashScope（OpenAI 兼容 Chat Completions）
# api_key: ${DASHSCOPE_API_KEY} · 见仓库根 .env.example
# 文档: https://help.aliyun.com/zh/model-studio/

qwen_3.8_max:
  label: "Qwen3.8 Max"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: "${DASHSCOPE_API_KEY}"
  model: "qwen3.8-max"
  pricing:
    currency: "CNY"
    cny_per_currency_unit: 1.0
    input_per_million: 12
    output_per_million: 36
    input_cache_hit_per_million: 1.5
    input_cache_miss_per_million: 12
  vendor_params:
    enable_search: false
    enable_thinking: true
    thinking_budget: 65536
    enable_web_extractor: false
    search_options:
      forced_search: false
      search_strategy: "turbo"
      enable_source: false
      enable_citation: false
      citation_format: "[<number>]"
      enable_search_extension: false
  capabilities:
    vision: true
    function_calling: true
    parallel_tool_calls: true
    reasoning_content: false
    thinking_tag_inline: true
    context_window: 1000000

qwen_3.7_plus:
  label: "Qwen3.7 Plus"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: "${DASHSCOPE_API_KEY}"
  model: "qwen3.7-plus"
  pricing:
    currency: "CNY"
    tiers:
      - input_token_limit: 256000
        input_per_million: 2.0
        output_per_million: 8.0
      - input_token_limit: 1000000
        input_per_million: 6.0
        output_per_million: 24.0
  vendor_params:
    enable_search: false
    enable_thinking: true
    thinking_budget: 65536
    enable_web_extractor: false
    search_options:
      forced_search: false
      search_strategy: "turbo"
      enable_source: false
      enable_citation: false
      citation_format: "[<number>]"
      enable_search_extension: false
  capabilities:
    vision: true
    function_calling: true
    parallel_tool_calls: true
    reasoning_content: false
    thinking_tag_inline: true
    context_window: 1000000
